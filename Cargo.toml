[package]
name = "valet"
version = "0.12.0"
edition = "2021"
autobins = false

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", features = ["sqlite", "runtime-tokio", "migrate"] }
tower-http = { version = "0.7", features = ["cors", "fs"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
dotenvy = "0.15"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
async-trait = "0.1"
tokio-stream = "0.1"
base64 = "0.23"
futures = "0.3"
async-stream = "0.3"
url = "2"
jsonwebtoken = "10"
axum-extra = { version = "0.10", features = ["cookie"] }
cookie = "0.18"
rand = "0.10"

# sqlite-vec provides the `vec0` virtual table. It must be registered on the
# *same* libsqlite3-sys instance that sqlx opens connections with, otherwise the
# extension would land on a second, unseen copy of SQLite. Declaring
# `libsqlite3-sys` as a direct dependency pins that single instance; Cargo then
# unifies it with the one `sqlx-sqlite` pulls in. `sqlite-vec 0.1.9` itself does
# not depend on `libsqlite3-sys`, so there is no version conflict to resolve.
sqlite-vec = { version = "0.1", optional = true }
libsqlite3-sys = "0.37"

[[bin]]
name = "valet"
path = "src/main.rs"

[[bin]]
name = "seed"
path = "src/bin/seed.rs"

[[bin]]
name = "valet-reindex"
path = "src/bin/reindex.rs"

[[bin]]
name = "valet-route-eval"
path = "src/bin/route-eval.rs"

[features]
default = ["vec0"]
vec0 = ["sqlite-vec"]

[dev-dependencies]
futures = "0.3"
serial_test = "4"
tower = { version = "0.5", features = ["util"] }
wiremock = "0.6"

[[test]]
name = "health"
path = "tests/api/health.rs"

[[test]]
