services:
  valet:
    image: ghcr.io/atareao/valet-ai:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - valet_data:/app/data
    environment:
      - DATABASE_URL=/app/data/valet.db
      - RUST_LOG=debug
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL}
      - COLLAPSE_MODEL=${COLLAPSE_MODEL:-mistralai/mistral-small-24b-instruct-2501}
      - MEMORY_MODEL=${MEMORY_MODEL:-mistralai/mistral-small-24b-instruct-2501}
      - SEMANTIC_MODEL=${SEMANTIC_MODEL:-mistralai/mistral-small-24b-instruct-2501}
      - MEMORY_BATCH_TOKENS=${MEMORY_BATCH_TOKENS:-2000}
      - MEMORY_INACTIVITY_MINUTES=${MEMORY_INACTIVITY_MINUTES:-30}
      - MEMORY_OVERLAP=${MEMORY_OVERLAP:-2}
      - MEMORY_POLL_INTERVAL_MINUTES=${MEMORY_POLL_INTERVAL_MINUTES:-30}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL}
      - EMBEDDING_DIMENSION=${EMBEDDING_DIMENSION}
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
      - GOOGLE_PLACES_API_KEY=${GOOGLE_PLACES_API_KEY}
      - BRAVE_SEARCH_API_KEY=${BRAVE_SEARCH_API_KEY}
      - AUTH_ENABLED=false

volumes:
  valet_data:
