# Valet — nginx del frontend de producción.
#
# Se instala como /etc/nginx/conf.d/default.conf dentro de la imagen
# (Dockerfile.frontend), no como nginx.conf global.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # No filtrar la versión de nginx en las cabeceras.
    server_tokens off;

    # ── SPA ──────────────────────────────────────────────────────
    # Sirve el asset si existe; si no, devuelve index.html para que el
    # router de React Router resuelva la ruta en el cliente (p. ej. /calendar).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API ──────────────────────────────────────────────────────
    # `proxy_pass` sin URI final conserva la ruta original (/api/...),
    # que es la que espera el backend de Axum.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;

        # Cabeceras para que el backend genere URLs absolutas correctas
        # cuando hay TLS terminando por delante (COOKIE Secure, redirects).
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE / streaming: sin buffering y sin cerrar la conexión.
        # `Connection ""` limpia el keep-alive del cliente para que nginx
        # gestione la conexión upstream; timeouts largos para no cortar
        # un stream que el usuario deja abierto.
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }
}
